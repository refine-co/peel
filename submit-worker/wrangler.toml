# Peel's submission API. Deploy with:  npx wrangler deploy
#
# Everything here needs an account that only Yow can create. The three ids below are printed by
# the `wrangler ... create` commands in README.md and have to be pasted in before the first
# deploy — they are account-specific, so they cannot be filled in ahead of time.

name = "peel-submit"
main = "src/index.js"
compatibility_date = "2026-10-01"

# This account is on Workers *Free* — checked in Billing on 17 Oct 2026, after an earlier note
# here claimed otherwise. Free allows about 10 ms of CPU per request, and /packs hashes up to
# 8 MiB and walks a zip inside that budget. A 5.4 MB pack went through production on 17 Oct,
# so it fits, but there is not much room: if large packs ever start answering 500, this is why.

[[d1_databases]]
binding = "DB"
database_name = "peel-submit"
database_id = "5a852b9c-3c7b-4ee9-bf92-a4094ed9d664"

[[r2_buckets]]
binding = "PACKS"
bucket_name = "peel-submissions"

[vars]
# Where a refusal tells people to write. Not a secret.
CONTACT = "refine.co.my@gmail.com"

# The audience every Google ID token must carry, and the serverClientId the Android app asks
# Google for. Not a secret — it ships inside the APK. It is still load-bearing: if this is
# missing, /account/google throws rather than falling back, because an undefined audience
# compares equal to a token with no audience and would accept anything Google ever signed.
GOOGLE_WEB_CLIENT_ID = "1072147454316-1vfqpurdr084eabr3q87pojqv370bf3o.apps.googleusercontent.com"

# No secrets at all. Nothing is emailed, so there is no provider and no API key.
